<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Love 💖</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(120deg, #ff9a9e, #fad0c4);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: 'Poppins', sans-serif;
  }

  h1 {
    color: white;
    font-size: 3em;
    text-align: center;
    animation: fadeIn 3s ease-in-out;
  }

  p {
    color: #fff;
    font-size: 1.3em;
    max-width: 600px;
    text-align: center;
    line-height: 1.5;
    animation: fadeIn 5s ease-in-out;
  }

  .heart {
    position: absolute;
    width: 20px;
    height: 20px;
    background: pink;
    transform: rotate(45deg);
    animation: float 5s infinite ease-in;
  }

  .heart::before, .heart::after {
    content: "";
    position: absolute;
    width: 20px;
    height: 20px;
    background: pink;
    border-radius: 50%;
  }

  .heart::before {
    top: -10px;
    left: 0;
  }

  .heart::after {
    left: 10px;
    top: 0;
  }

  @keyframes float {
    0% {
      transform: translateY(0) rotate(45deg);
      opacity: 1;
    }
    100% {
      transform: translateY(-800px) rotate(45deg);
      opacity: 0;
    }
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .btn {
    margin-top: 30px;
    padding: 12px 25px;
    font-size: 1.1em;
    color: #fff;
    background: #ff5f6d;
    border: none;
    border-radius: 25px;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  .btn:hover {
    background: #ffc371;
    color: #ff5f6d;
    transform: scale(1.1);
  }

  audio {
    display: none;
  }
</style>
</head>
<body>
  <h1>Hey My Love ❤️</h1>
  <p>
    You are the reason behind my smile,<br>
    the sparkle in my eyes,<br>
    and the warmth in my heart. ✨<br><br>
    Every day with you feels magical.<br>
    This page is just to remind you how special you are to me. 💕
  </p>
  
  <button class="btn" onclick="startMagic()">Click Me 💗</button>

  <audio id="bgMusic" loop>
    <!-- Replace the below link with your favorite song MP3 URL -->
    <source src="https://cdn.pixabay.com/download/audio/2023/03/05/audio_2a13e87dbf.mp3?filename=romantic-piano-144528.mp3" type="audio/mpeg">
  </audio>

  <script>
    function showHearts() {
      for (let i = 0; i < 30; i++) {
        let heart = document.createElement("div");
        heart.className = "heart";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.animationDuration = (3 + Math.random() * 2) + "s";
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 5000);
      }
    }

    function startMagic() {
      showHearts();
      const music = document.getElementById("bgMusic");
      music.play();
    }
  </script>
</body>
</html>
